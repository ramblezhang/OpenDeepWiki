services:
  opendeepwiki:
    image: crpi-j9ha7sxwhatgtvj4.cn-shenzhen.personal.cr.aliyuncs.com/open-deepwiki/opendeepwiki
    build:
      context: .
      dockerfile: src/OpenDeepWiki/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    user: "${OPENDEEPWIKI_UID:-1000}:${OPENDEEPWIKI_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      # ASP.NET Core 环境
      - ASPNETCORE_ENVIRONMENT=Production

      # 服务监听地址
      - URLS=http://+:8080

      # 数据库配置 (PostgreSQL)
      - Database__Type=postgresql
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=opendeepwiki;Username=postgres;Password=opendeepwiki123

      # JWT 认证配置 (生产环境请修改)
      - JWT_SECRET_KEY=OpenDeepWiki-Default-Secret-Key-Please-Change-In-Production-Environment-2024

      # 仓库存储目录
      - REPOSITORIES_DIRECTORY=/data

      # AI 服务配置 (全局默认，用于 Chat 等功能)
      - CHAT_API_KEY=your-chat-api-key
      - ENDPOINT=https://api.openai.com/v1
      - CHAT_REQUEST_TYPE=OpenAI

      # Wiki 生成器配置 - 目录生成
      - WIKI_CATALOG_MODEL=gpt-4o
      - WIKI_CATALOG_ENDPOINT=https://api.openai.com/v1
      - WIKI_CATALOG_API_KEY=your-catalog-api-key
      - WIKI_CATALOG_REQUEST_TYPE=OpenAI

      # Wiki 生成器配置 - 内容生成
      - WIKI_CONTENT_MODEL=gpt-4o
      - WIKI_CONTENT_ENDPOINT=https://api.openai.com/v1
      - WIKI_CONTENT_API_KEY=your-content-api-key
      - WIKI_CONTENT_REQUEST_TYPE=OpenAI

      # Wiki 生成器配置 - 翻译 (可选，不配置则使用内容生成配置)
      # - WIKI_TRANSLATION_MODEL=gpt-4o
      # - WIKI_TRANSLATION_ENDPOINT=https://api.openai.com/v1
      # - WIKI_TRANSLATION_API_KEY=your-translation-api-key
      # - WIKI_TRANSLATION_REQUEST_TYPE=OpenAI

      # Wiki 生成并行数 (默认: 5)
      - WIKI_PARALLEL_COUNT=5

      # 多语言支持 (逗号分隔，例如: zh,en)
      - WIKI_LANGUAGES=${WIKI_LANGUAGES:-zh}

      # Incremental update worker (set INCREMENTAL_UPDATE_ENABLED=false to pause scheduled scans)
      - IncrementalUpdate__Enabled=${INCREMENTAL_UPDATE_ENABLED:-true}

      # MCP declared-user access control. Keep false during the legacy-client migration window.
      - MCP_ACCESS_FILE=/data/mcp-access.yaml
      - MCP_REQUIRE_CALLER_USER=${MCP_REQUIRE_CALLER_USER:-false}
      - MCP_USAGE_RETENTION_DAYS=${MCP_USAGE_RETENTION_DAYS:-180}
      - MCP_USAGE_FALLBACK_FILE=/data/mcp-usage-fallback.jsonl
      - MCP_USAGE_FALLBACK_MAX_BYTES=${MCP_USAGE_FALLBACK_MAX_BYTES:-10485760}
      - MCP_USAGE_FALLBACK_BACKUP_COUNT=${MCP_USAGE_FALLBACK_BACKUP_COUNT:-12}
      - FORWARDED_HEADERS_TRUSTED_NETWORK=${FORWARDED_HEADERS_TRUSTED_NETWORK:-192.168.0.0/20}
    volumes:
      - ./data:/data

  web:
    image: crpi-j9ha7sxwhatgtvj4.cn-shenzhen.personal.cr.aliyuncs.com/open-deepwiki/opendeepwiki-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      opendeepwiki:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_PROXY_URL=http://opendeepwiki:8080

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_DB=opendeepwiki
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=opendeepwiki123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
